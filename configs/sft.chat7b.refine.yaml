project:
  run_name: room_chat_qwen25_7b_instruct_v1_refine
  seed: 42

paths:
  raw_glob: data/raw/inbox/*.txt
  output_dir: data/sft/chat7b
  train_jsonl: data/sft/chat7b/train.jsonl
  val_jsonl: data/sft/chat7b/val.jsonl
  cpt_train_jsonl: data/sft/chat7b/cpt_train.jsonl
  cpt_val_jsonl: data/sft/chat7b/cpt_val.jsonl
  preview_json: data/sft/chat7b/preview.json
  stats_json: data/sft/chat7b/stats.json
  checkpoints_root: checkpoints_lora
  stop_file_name: STOP
  status_json: checkpoints_lora/{run_name}/status.json

data:
  val_ratio: 0.02
  include_system: false
  shuffle_before_split: false
  session_gap_minutes: 180
  context_turns: 8
  min_context_turns: 2
  sample_stride: 1
  merge_same_speaker: true
  merge_gap_minutes: 2
  max_merged_chars: 320
  min_message_chars: 2
  min_target_chars: 8
  max_message_chars: 320
  drop_low_signal: true
  mask_urls: true
  mask_numbers: false
  drop_media_only: true
  drop_summary_artifacts: true
  summary_bullet_min_count: 1
  drop_mention_messages: true
  max_mentions_per_message: 0
  strip_mentions_before_filter: false
  max_examples_per_split: 0
  training_mode: projected_dialogue
  target_speakers: ${CHATBOT_PERSONA_SPEAKERS:[]}
  project_user_names: true
  min_other_speaker_turns: 1
  require_last_context_from_other_speaker: true

cpt_data:
  window_messages: 64
  stride_messages: 16
  min_messages: 10
  min_chars: 120
  max_chars: 2200
  use_speaker_prefix: true

pipeline:
  enabled: true
  run_cpt_first: false
  bootstrap_sft_from_cpt: false
  cpt_run_name_suffix: "_cpt"
  skip_cpt_if_sft_has_checkpoint: true
  require_cpt_complete_before_sft: false
  fail_if_sft_bootstrap_missing: false
  fail_if_existing_sft_run_is_fresh: false

prompt:
  system: |
    너는 카카오톡 방 멤버 같은 말투를 유지하지만, 지금은 user와 1:1로 대화하는 bot이다.
    질문을 받으면 먼저 직접 답하고, 모르면 솔직히 말하되 문맥에 맞게 짧고 자연스럽게 이어간다.
    말투는 너무 설명조로 길어지지 않지만, 필요한 내용은 빼먹지 않는다.
  task: |
    아래는 user와 bot의 최근 대화다.
    user 발화 안의 [이름] 표시는 톡방 문맥에서 언급된 사람 이름이다.
    문맥에 맞게 bot의 다음 답변 1개를 작성하라. 답변 문장만 출력하라.
  response_one_line: false

model:
  base_model: Qwen/Qwen2.5-7B-Instruct
  trust_remote_code: true
  use_fast_tokenizer: true
  local_files_only: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

cpt_training:
  max_seq_len: 768
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  grad_accum_steps: 4
  learning_rate: 0.00015
  weight_decay: 0.01
  warmup_ratio: 0.02
  lr_scheduler_type: cosine
  max_steps: 12000
  num_train_epochs: 1
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 20
  save_total_limit: 30
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  dataloader_num_workers: 2
  load_best_model_at_end: true
  early_stopping_patience: 2

training:
  max_seq_len: 768
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  grad_accum_steps: 4
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_steps: 6000
  num_train_epochs: 1
  eval_steps: 500
  save_steps: 500
  logging_steps: 20
  save_total_limit: 40
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  dataloader_num_workers: 2
  load_best_model_at_end: true
  early_stopping_patience: 4
  require_init_adapter_on_fresh_start: true

generation:
  inference_mode: one_on_one
  max_new_tokens: 128
  do_sample: true
  temperature: 0.72
  top_p: 0.90
  top_k: 40
  repetition_penalty: 1.05
  no_repeat_ngram_size: 4
  avoid_summary_artifacts: true
  avoid_self_echo: true
  avoid_repetitive_output: true
  max_mentions: 1
  max_history_turns: 8
  max_bot_history_turns: 3
  min_reply_chars: 8
  candidate_count: 2
  regen_attempts: 1
  one_line: false
  max_chars: 320
  use_chat_template: true
  group_min_user_turns_since_last_bot: 0
  group_max_bot_turns_in_window: 0
  group_block_consecutive_bot: false
  group_no_reply_token: "<NO_REPLY>"
  enable_confidence_fallback: false
  confidence_threshold: 0.02
  confidence_min_tokens: 6
  confidence_fallback_texts:
    - "...?"
  confidence_fallback_target_rate: 0.0
  confidence_fallback_rate_window: 200

smoke:
  prompts:
    - 오늘 분위기 어때
    - 아까 얘기 이어서 말해봐
    - 그럼 지금 뭘 하는게 좋을까

security:
  require_password: true
  password_env: CHATBOT_PASSWORD
